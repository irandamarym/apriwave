[package]
name = "apriwave"
version = "4.0.0"
edition = "2021"
description = "ApriWave (ApricotWave Protocol v4.0): deterministic, Sans-I/O relational framework - host crate (std): file-system DTI cache, assisted editor, JSON export, CLI"
authors = ["irandamarym"]
license = "GPL-3.0-or-later"
repository = "https://github.com/irandamarym/apriwave"
readme = "README.md"
keywords = ["protocol", "parser", "m2m", "semantics", "deterministic"]
categories = ["parser-implementations", "encoding"]

[lib]
name = "apriwave"
path = "src/lib.rs"

[[bin]]
name = "apriwave-cli"
path = "src/main.rs"

[workspace]
members = [".", "apriwave-core"]
resolver = "2"

[dependencies]
apriwave-core = { path = "apriwave-core", version = "4.0.0" }
# Optional Ghost Protocol v2 suites (src/ghost). The default build has no dependencies.
argon2 = { version = "0.6.0", optional = true, default-features = false, features = ["alloc"] }
ascon-hash = { version = "0.4.0", optional = true }
blake3 = { version = "1.8.7", optional = true }
skein = { version = "0.2.0", optional = true }

[features]
ghost-blake3 = ["dep:blake3"]
ghost-ascon = ["dep:ascon-hash"]
ghost-skein = ["dep:skein"]
ghost-argon2 = ["dep:argon2"]
